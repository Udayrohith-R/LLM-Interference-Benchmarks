[project]
name = "llm-inference-benchmarks"
version = "2.0.0"
description = "Reproducible LLM inference benchmarks: PyTorch vs vLLM vs TensorRT-LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "accelerate>=0.31.0",
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0"]
nvml = ["pynvml>=11.0.0"]
dev  = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
